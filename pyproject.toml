[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "promptfence"
version = "0.1.0"
description = "Offline defensive linter for agent system prompts and tool manifests: fence gaps, unbounded tools, missing refusal language."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Rashed Hasan" }]
keywords = ["agents", "llm", "prompts", "security", "defensive", "cli", "lint"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Environment :: Console",
  "Topic :: Security",
  "Intended Audience :: Developers",
]
dependencies = []

[project.scripts]
promptfence = "promptfence.cli:main"

[project.urls]
Homepage = "https://github.com/rashedhasan090/promptfence"
Repository = "https://github.com/rashedhasan090/promptfence"

[tool.setuptools.packages.find]
where = ["src"]
